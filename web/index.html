<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peta - HTML Upload</title>
    <link rel="stylesheet" href="/web/index.css?v=1" />
  </head>
  <body>
    <main>
      <section class="app-card">
        <div class="title-row">
          <h1>Peta</h1>
          <span class="title-badge">ぺたっと共有</span>
        </div>
        <p class="lead">HTMLを貼り付けるか、HTMLファイルをアップロードして共有URLを発行します。</p>

        <div class="upload-mode">
          <label for="htmlFileInput">HTMLファイルをアップロード (.html/.htm)</label>
          <div class="file-picker-row">
            <button id="filePickButton" class="file-picker-button" type="button">
              ファイルをえらぶ
            </button>
            <input
              id="htmlFileInput"
              class="file-picker-input"
              type="file"
              accept=".html,.htm,text/html"
            />
          </div>
          <div id="dropZone" class="drop-zone" role="button" tabindex="0">
            ここにHTMLファイルをドラッグ&ドロップ
          </div>
          <div id="fileHint" class="file-hint">選択中ファイル: なし</div>
        </div>

        <details class="html-accordion">
          <summary>HTMLを直接貼り付ける</summary>
          <textarea id="htmlInput" placeholder="<h1>Hello World</h1>"></textarea>
        </details>

        <div class="actions">
          <button id="uploadButton">アップロード</button>
        </div>

        <div id="error"></div>

        <div id="result">
          共有URL:
          <a id="resultLink" href="#" target="_blank" rel="noreferrer noopener"></a>
        </div>

        <section class="history">
          <h2>発行した共有リンク履歴</h2>
          <ul id="historyList"></ul>
        </section>

        <div class="tips">
          <span class="dot"></span>
          ファイル選択/ドラッグ&ドロップ時はファイル内容を優先してアップロードします
        </div>
      </section>
    </main>

    <script>
      const htmlInput = document.getElementById("htmlInput");
      const filePickButton = document.getElementById("filePickButton");
      const htmlFileInput = document.getElementById("htmlFileInput");
      const dropZone = document.getElementById("dropZone");
      const fileHint = document.getElementById("fileHint");
      const uploadButton = document.getElementById("uploadButton");
      const result = document.getElementById("result");
      const resultLink = document.getElementById("resultLink");
      const error = document.getElementById("error");
      const historyList = document.getElementById("historyList");
      let selectedFile = null;

      function isHTMLFile(file) {
        if (!file || !file.name) {
          return false;
        }
        const name = file.name.toLowerCase();
        return name.endsWith(".html") || name.endsWith(".htm");
      }

      function setSelectedFile(file) {
        if (!file) {
          selectedFile = null;
          fileHint.textContent = "選択中ファイル: なし";
          return;
        }
        if (!isHTMLFile(file)) {
          error.textContent = "`.html` または `.htm` ファイルを選択してください。";
          return;
        }
        selectedFile = file;
        fileHint.textContent = `選択中ファイル: ${file.name}`;
        error.textContent = "";
      }

      function formatDateTime(raw) {
        const date = new Date(raw);
        if (Number.isNaN(date.getTime())) {
          return raw;
        }
        return date.toLocaleString("ja-JP");
      }

      function renderHistoryItem(item) {
        const li = document.createElement("li");

        const link = document.createElement("a");
        link.href = item.url;
        link.target = "_blank";
        link.rel = "noreferrer noopener";
        link.textContent = item.title || item.url;

        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = formatDateTime(item.created_at);

        li.appendChild(link);
        li.appendChild(meta);
        return li;
      }

      function renderEmptyHistory() {
        historyList.innerHTML = "";
        const li = document.createElement("li");
        li.textContent = "まだ履歴がありません。";
        historyList.appendChild(li);
      }

      async function loadHistory() {
        try {
          const res = await fetch("/history");
          if (!res.ok) {
            throw new Error("履歴の取得に失敗しました。");
          }
          const items = await res.json();
          historyList.innerHTML = "";
          if (!Array.isArray(items) || items.length === 0) {
            renderEmptyHistory();
            return;
          }
          items.forEach((item) => {
            historyList.appendChild(renderHistoryItem(item));
          });
        } catch (e) {
          historyList.innerHTML = "";
          const li = document.createElement("li");
          li.textContent = e.message || "履歴の取得に失敗しました。";
          historyList.appendChild(li);
        }
      }

      htmlFileInput.addEventListener("change", () => {
        const file = htmlFileInput.files && htmlFileInput.files[0];
        setSelectedFile(file || null);
      });

      filePickButton.addEventListener("click", () => {
        htmlFileInput.click();
      });

      dropZone.addEventListener("click", () => {
        htmlFileInput.click();
      });

      dropZone.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          htmlFileInput.click();
        }
      });

      dropZone.addEventListener("dragenter", (event) => {
        event.preventDefault();
        dropZone.classList.add("active");
      });

      dropZone.addEventListener("dragover", (event) => {
        event.preventDefault();
      });

      dropZone.addEventListener("dragleave", (event) => {
        if (!dropZone.contains(event.relatedTarget)) {
          dropZone.classList.remove("active");
        }
      });

      dropZone.addEventListener("drop", (event) => {
        event.preventDefault();
        dropZone.classList.remove("active");
        const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
        setSelectedFile(file || null);
      });

      uploadButton.addEventListener("click", async () => {
        const html = htmlInput.value.trim();
        const file = selectedFile;
        result.style.display = "none";
        error.textContent = "";

        if (!html && !file) {
          error.textContent = "HTMLを入力するか、HTMLファイルを選択してください。";
          return;
        }

        uploadButton.disabled = true;
        uploadButton.textContent = "送信中...";

        try {
          let res;
          if (file) {
            const formData = new FormData();
            formData.append("file", file);
            res = await fetch("/upload", {
              method: "POST",
              body: formData,
            });
          } else {
            res = await fetch("/upload", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ html }),
            });
          }

          if (!res.ok) {
            const text = await res.text();
            throw new Error(text || "アップロードに失敗しました。");
          }

          const data = await res.json();
          const absoluteURL = new URL(data.url, window.location.origin).toString();
          resultLink.href = absoluteURL;
          resultLink.textContent = absoluteURL;
          result.style.display = "block";
          await loadHistory();
        } catch (e) {
          error.textContent = e.message || "アップロードに失敗しました。";
        } finally {
          uploadButton.disabled = false;
          uploadButton.textContent = "アップロード";
        }
      });

      loadHistory();
    </script>
  </body>
</html>
