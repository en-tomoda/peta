<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peta - HTML Upload</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f7fa;
        color: #1a1a1a;
      }
      main {
        max-width: 860px;
        margin: 40px auto;
        padding: 0 16px;
      }
      h1 {
        margin-bottom: 8px;
      }
      p {
        color: #666;
      }
      .upload-mode {
        margin-top: 16px;
        display: grid;
        gap: 8px;
      }
      input[type="file"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #d0d0d0;
        border-radius: 10px;
        box-sizing: border-box;
        background: #fff;
      }
      textarea {
        width: 100%;
        min-height: 320px;
        margin-top: 16px;
        border: 1px solid #d0d0d0;
        border-radius: 10px;
        padding: 12px;
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        box-sizing: border-box;
        background: #fff;
      }
      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-top: 12px;
      }
      button {
        border: 0;
        border-radius: 8px;
        background: #2b6ef3;
        color: #fff;
        padding: 10px 16px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #result {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        background: #eef4ff;
        display: none;
      }
      #error {
        margin-top: 12px;
        color: #c80000;
        min-height: 20px;
      }
      .history {
        margin-top: 24px;
        background: #fff;
        border: 1px solid #e3e5ef;
        border-radius: 10px;
        padding: 12px;
      }
      .history h2 {
        margin: 0 0 10px;
        font-size: 14px;
      }
      .history ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .history li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid #f1f2f7;
        padding-bottom: 8px;
      }
      .history li:last-child {
        border-bottom: 0;
        padding-bottom: 0;
      }
      .history .meta {
        color: #666;
        font-size: 12px;
        white-space: nowrap;
      }
      code {
        background: #fff;
        border: 1px solid #d8e2ff;
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Peta</h1>
      <p>HTMLを貼り付けるか、HTMLファイルをアップロードして共有URLを発行します。</p>

      <div class="upload-mode">
        <label for="htmlFileInput">HTMLファイルをアップロード (.html/.htm)</label>
        <input id="htmlFileInput" type="file" accept=".html,.htm,text/html" />
      </div>

      <textarea id="htmlInput" placeholder="<h1>Hello World</h1>"></textarea>

      <div class="actions">
        <button id="uploadButton">アップロード</button>
      </div>

      <div id="error"></div>

      <div id="result">
        共有URL:
        <a id="resultLink" href="#" target="_blank" rel="noreferrer noopener"></a>
      </div>

      <section class="history">
        <h2>発行した共有リンク履歴</h2>
        <ul id="historyList"></ul>
      </section>
    </main>

    <script>
      const htmlInput = document.getElementById("htmlInput");
      const htmlFileInput = document.getElementById("htmlFileInput");
      const uploadButton = document.getElementById("uploadButton");
      const result = document.getElementById("result");
      const resultLink = document.getElementById("resultLink");
      const error = document.getElementById("error");
      const historyList = document.getElementById("historyList");

      function formatDateTime(raw) {
        const date = new Date(raw);
        if (Number.isNaN(date.getTime())) {
          return raw;
        }
        return date.toLocaleString("ja-JP");
      }

      function renderHistoryItem(item) {
        const li = document.createElement("li");

        const link = document.createElement("a");
        link.href = item.url;
        link.target = "_blank";
        link.rel = "noreferrer noopener";
        link.textContent = item.title || item.url;

        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = formatDateTime(item.created_at);

        li.appendChild(link);
        li.appendChild(meta);
        return li;
      }

      function renderEmptyHistory() {
        historyList.innerHTML = "";
        const li = document.createElement("li");
        li.textContent = "まだ履歴がありません。";
        historyList.appendChild(li);
      }

      async function loadHistory() {
        try {
          const res = await fetch("/history");
          if (!res.ok) {
            throw new Error("履歴の取得に失敗しました。");
          }
          const items = await res.json();
          historyList.innerHTML = "";
          if (!Array.isArray(items) || items.length === 0) {
            renderEmptyHistory();
            return;
          }
          items.forEach((item) => {
            historyList.appendChild(renderHistoryItem(item));
          });
        } catch (e) {
          historyList.innerHTML = "";
          const li = document.createElement("li");
          li.textContent = e.message || "履歴の取得に失敗しました。";
          historyList.appendChild(li);
        }
      }

      uploadButton.addEventListener("click", async () => {
        const html = htmlInput.value.trim();
        const file = htmlFileInput.files && htmlFileInput.files[0];
        result.style.display = "none";
        error.textContent = "";

        if (!html && !file) {
          error.textContent = "HTMLを入力するか、HTMLファイルを選択してください。";
          return;
        }

        uploadButton.disabled = true;
        uploadButton.textContent = "送信中...";

        try {
          let res;
          if (file) {
            const formData = new FormData();
            formData.append("file", file);
            res = await fetch("/upload", {
              method: "POST",
              body: formData,
            });
          } else {
            res = await fetch("/upload", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ html }),
            });
          }

          if (!res.ok) {
            const text = await res.text();
            throw new Error(text || "アップロードに失敗しました。");
          }

          const data = await res.json();
          const absoluteURL = new URL(data.url, window.location.origin).toString();
          resultLink.href = absoluteURL;
          resultLink.textContent = absoluteURL;
          result.style.display = "block";
          await loadHistory();
        } catch (e) {
          error.textContent = e.message || "アップロードに失敗しました。";
        } finally {
          uploadButton.disabled = false;
          uploadButton.textContent = "アップロード";
        }
      });

      loadHistory();
    </script>
  </body>
</html>
