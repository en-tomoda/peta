<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peta Share</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #fff;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .preview-header {
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        box-sizing: border-box;
        padding: 0 10px;
        font: 12px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #2f2f2f;
        background: #f6f7fb;
        border-bottom: 1px solid #dcdfea;
      }
      .preview-header strong {
        font-weight: 600;
      }
      .preview-header a {
        color: inherit;
        text-decoration: none;
      }
      .preview-header a:hover {
        text-decoration: underline;
      }
      .preview-header .page-id {
        color: #666;
      }
      iframe {
        display: block;
        width: 100%;
        height: calc(100% - 32px);
        border: 0;
      }
    </style>
  </head>
  <body>
    <header class="preview-header">
      <strong><a href="/">Peta Preview</a></strong>
      <span class="page-id">ID: {{.ID}}</span>
    </header>
    <iframe
      src="/content/{{.ID}}"
      sandbox="allow-scripts allow-forms"
      referrerpolicy="no-referrer"
    ></iframe>
  </body>
</html>
