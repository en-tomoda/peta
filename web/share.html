<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peta Share</title>
    <link rel="stylesheet" href="/web/share.css?v=1" />
  </head>
  <body>
    <header class="preview-header">
      <strong><a href="/">Peta Preview</a></strong>
      <span class="page-id">ID: {{.ID}}</span>
    </header>
    <iframe
      src="/content/{{.ID}}"
      sandbox="allow-scripts allow-forms"
      referrerpolicy="no-referrer"
    ></iframe>
  </body>
</html>
