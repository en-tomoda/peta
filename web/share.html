<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peta Share</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/web/favicon.svg" />
    <link rel="stylesheet" href="/web/share.css" />
  </head>
  <body>
    <header class="preview-header">
      <strong><a href="/">Peta</a></strong>
      <span class="page-id">{{.ID}}</span>
    </header>
    <iframe
      src="/content/{{.ID}}"
      sandbox="allow-scripts allow-forms"
      referrerpolicy="no-referrer"
    ></iframe>
    <script>
      const saved = localStorage.getItem("peta-theme") || "light";
      document.documentElement.dataset.theme = saved;
    </script>
  </body>
</html>
