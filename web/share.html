<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Peta Share</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/web/favicon.svg" />
    <link rel="stylesheet" href="/web/share.css" />
  </head>
  <body data-page-id="{{.ID}}">
    <header class="preview-header" id="previewHeader">
      <div class="header-left">
        <a class="header-brand" href="/">Peta</a>
        <span class="header-sep">/</span>
        <span class="header-id">{{.ID}}</span>
      </div>
      <button class="header-toggle" id="headerToggle" type="button" title="ヘッダーを隠す">
        <svg width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 7L6 2L11 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </header>

    <button class="header-tab" id="headerTab" type="button" title="ヘッダーを表示">
      <svg width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M1 1L6 6L11 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="stage">
      <div class="preview" id="preview">
        <iframe
          id="previewFrame"
          src="/content/{{.ID}}"
          sandbox="allow-scripts allow-forms"
          referrerpolicy="no-referrer"
        ></iframe>

        <div class="pin-layer" id="pinLayer"></div>

        <div class="mode-hint" id="modeHint">コメントしたい位置をクリック（Esc で解除）</div>

        <div class="comment-widget" id="commentWidget">
          <button class="widget-btn" id="modeToggle" type="button" title="コメントモード">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M11.3 1.9a1.3 1.3 0 0 1 1.8 0l1 1a1.3 1.3 0 0 1 0 1.8l-7 7-3 .9.9-3 7-7.7z"
                    stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="widget-btn" id="panelToggle" type="button" title="コメント一覧">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 3.2A1.2 1.2 0 0 1 3.2 2h9.6A1.2 1.2 0 0 1 14 3.2v6.4a1.2 1.2 0 0 1-1.2 1.2H6l-3.2 2.6a.4.4 0 0 1-.8-.3V3.2z"
                    stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            </svg>
            <span class="widget-badge" id="widgetBadge" hidden></span>
          </button>
        </div>
      </div>

      <aside class="comment-panel" id="commentPanel" hidden>
        <div class="panel-head">
          <span class="panel-title">コメント</span>
          <span class="panel-count" id="panelCount">0</span>
          <button class="panel-close" id="panelClose" type="button" title="閉じる">
            <svg width="11" height="11" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>

        <div class="panel-filter">
          <button type="button" class="filter-btn is-active" data-filter="all">すべて</button>
          <button type="button" class="filter-btn" data-filter="open">未解決</button>
          <button type="button" class="panel-me" id="panelMe"></button>
        </div>

        <div class="panel-body" id="panelBody"></div>
      </aside>
    </div>

    <div class="toast" id="toast" hidden></div>

    <script src="/web/share.js" defer></script>
  </body>
</html>
